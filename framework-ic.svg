<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="Inter, 'Noto Sans TC', system-ui, -apple-system, sans-serif">
  <title>Climate–Care Nexus Research Architecture</title>
  <desc>I-Chun Chen's research framework: instruments (CVCVI, ICE, CCNI, C-FLAG), four research domains, evidence base, cross-cutting themes, and policy translation across Asia and Europe.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1C5A4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Climate–Care Nexus Research Architecture</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#73726C">I-Chun Isabelle Chen, PhD · 氣候—照護交會研究架構</text>

  <!-- LAYER 1: Instruments -->
  <text x="40" y="76" font-size="12" font-weight="500" fill="#5F5E5A" letter-spacing="0.3">Instruments · 量測工具</text>

  <rect x="40" y="86" width="92" height="30" rx="6" fill="#FBF0DD" stroke="#C7922F" stroke-width="0.5"/>
  <text x="86" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#6B4A08">CVCVI</text>

  <rect x="142" y="86" width="62" height="30" rx="6" fill="#FBF0DD" stroke="#C7922F" stroke-width="0.5"/>
  <text x="173" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#6B4A08">ICE</text>

  <rect x="214" y="86" width="72" height="30" rx="6" fill="#FBF0DD" stroke="#C7922F" stroke-width="0.5"/>
  <text x="250" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#6B4A08">CCNI</text>

  <rect x="296" y="86" width="90" height="30" rx="6" fill="#FBF0DD" stroke="#C7922F" stroke-width="0.5"/>
  <text x="341" y="101" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#6B4A08">C-FLAG</text>

  <rect x="396" y="86" width="244" height="30" rx="6" fill="#FBF0DD" stroke="#C7922F" stroke-width="0.5"/>
  <text x="518" y="101" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B5E0A">Cross-cultural psychometrics</text>

  <!-- LAYER 2: Research Domains -->
  <text x="40" y="140" font-size="12" font-weight="500" fill="#5F5E5A" letter-spacing="0.3">Research domains · 研究領域</text>

  <rect x="40" y="150" width="136" height="60" rx="8" fill="#E1F5EE" stroke="#1C5A4A" stroke-width="0.5"/>
