  <text x="40" y="302" font-size="12" font-weight="500" fill="#5F5E5A" letter-spacing="0.3">Cross-cutting themes · 橫切議題</text>

  <rect x="40" y="312" width="192" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="136" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Gender equity</text>

  <rect x="244" y="312" width="192" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Digital inclusion</text>

  <rect x="448" y="312" width="192" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="544" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Disaster resilience</text>

  <rect x="40" y="348" width="192" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="136" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Community care</text>

  <rect x="244" y="348" width="204" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="346" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Faith-based networks</text>

  <rect x="460" y="348" width="180" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="550" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Social protection</text>

  <!-- LAYER 5: Policy Translation Reach -->
  <text x="40" y="404" font-size="12" font-weight="500" fill="#5F5E5A" letter-spacing="0.3">Policy translation reach · 政策轉譯範圍</text>

  <rect x="40" y="414" width="600" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="429" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Taiwan → Thailand → Japan → Germany → UK → ASEAN → Global</text>

  <!-- Footer: Networks -->
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#B4B2A9">Climate Care Lab · Inter-CARE · ILO · WHO · OECD</text>
</svg>
