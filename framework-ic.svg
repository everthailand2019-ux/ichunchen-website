  <rect x="508" y="246" width="132" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="574" y="261" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">368 townships</text>

