  <line x1="176" y1="180" x2="192" y2="180" stroke="#1C5A4A" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="198" y="150" width="118" height="60" rx="8" fill="#E1F5EE" stroke="#1C5A4A" stroke-width="0.5"/>
  <text x="257" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Emotions</text>
  <text x="257" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ICE family</text>

  <line x1="316" y1="180" x2="332" y2="180" stroke="#1C5A4A" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="338" y="150" width="136" height="60" rx="8" fill="#E1F5EE" stroke="#1C5A4A" stroke-width="0.5"/>
  <text x="406" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Evidence</text>
  <text x="406" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">NHIRD · HART</text>

  <line x1="474" y1="180" x2="490" y2="180" stroke="#1C5A4A" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="496" y="150" width="144" height="60" rx="8" fill="#E1F5EE" stroke="#1C5A4A" stroke-width="0.5"/>
  <text x="568" y="173" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Governance</text>
  <text x="568" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Policy</text>

