  <text x="110" y="261" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Taiwan NHIRD</text>

  <rect x="192" y="246" width="140" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
