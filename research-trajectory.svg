<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
<style>
  text { font-family: Georgia, 'Times New Roman', serif; }
  .yr { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  .ph-en { font-size: 13px; font-weight: 700; }
  .ph-zh { font-size: 11.5px; font-weight: 400; fill-opacity: 0.7; }
  .tp-en { font-size: 10px; fill: #777; }
  .tp-zh { font-size: 9.5px; fill: #999; }
  .geo { font-size: 9px; fill: #bbb; letter-spacing: 0.3px; }
</style>
<defs>
  <linearGradient id="gFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b0b0b0"/>
    <stop offset="28%" stop-color="#185FA5"/>
    <stop offset="62%" stop-color="#1C5A4A"/>
    <stop offset="100%" stop-color="#C7922F"/>
  </linearGradient>
  <linearGradient id="gRiver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.06"/>
    <stop offset="28%" stop-color="#185FA5" stop-opacity="0.07"/>
    <stop offset="62%" stop-color="#1C5A4A" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#C7922F" stop-opacity="0.14"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0 0 L8 3 L0 6" fill="none" stroke="#ccc" stroke-width="1"/>
  </marker>
  <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0 0 L8 3 L0 6" fill="none" stroke="#C7922F" stroke-width="1.2"/>
  </marker>
</defs>

<!-- Timeline baseline -->
<line x1="60" y1="130" x2="700" y2="130" stroke="#e8e4de" stroke-width="1"/>

<!-- River / flow band (widens towards the right) -->
<path d="M75 115 Q185 105, 260 112 Q370 122, 470 114 Q570 105, 680 108
         L680 152 Q570 158, 470 148 Q370 140, 260 150 Q185 156, 75 145 Z"
      fill="url(#gRiver)"/>

<!-- Main flow line with gentle S-curve -->
<path d="M75 130 Q185 120, 260 130 Q370 140, 470 130 Q570 120, 680 130"
      stroke="url(#gFlow)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<!-- Directional arrows between phases -->
<line x1="118" y1="130" x2="218" y2="130" stroke="#ccc" stroke-width="1" marker-end="url(#arrowG)"/>
<line x1="302" y1="130" x2="418" y2="130" stroke="#bbc" stroke-width="1" marker-end="url(#arrowG)"/>
<line x1="510" y1="130" x2="618" y2="130" stroke="#C7922F" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGold)"/>

<!-- ═══════════ Phase 1: Foundations ═══════════ -->
<circle cx="90" cy="130" r="22" fill="#fafafa" stroke="#b0b0b0" stroke-width="1.8"/>
<text x="90" y="135" text-anchor="middle" font-size="15" fill="#aaa" font-weight="700" font-family="Georgia, serif">I</text>

<text x="90" y="82" text-anchor="middle" class="yr" fill="#999">2015–2019</text>
<text x="90" y="175" text-anchor="middle" class="ph-en" fill="#888">Foundations</text>
<text x="90" y="192" text-anchor="middle" class="ph-zh" fill="#888">基礎期</text>

<text x="90" y="214" text-anchor="middle" class="tp-en">Tourism &amp; hospitality</text>
<text x="90" y="228" text-anchor="middle" class="tp-zh">觀光餐旅</text>
<text x="90" y="246" text-anchor="middle" class="tp-en">Sports management</text>
<text x="90" y="260" text-anchor="middle" class="tp-zh">運動管理</text>
<text x="90" y="278" text-anchor="middle" class="tp-en">Cross-cultural studies</text>
<text x="90" y="292" text-anchor="middle" class="tp-zh">跨文化研究</text>

<text x="90" y="320" text-anchor="middle" class="geo">Taiwan 台灣</text>

<!-- ═══════════ Phase 2: Health & Aging ═══════════ -->
<circle cx="265" cy="130" r="25" fill="#f2f6ff" stroke="#185FA5" stroke-width="2"/>
<text x="265" y="135" text-anchor="middle" font-size="15" fill="#185FA5" font-weight="700" font-family="Georgia, serif">II</text>

<text x="265" y="82" text-anchor="middle" class="yr" fill="#185FA5">2020–2023</text>
<text x="265" y="175" text-anchor="middle" class="ph-en" fill="#185FA5">Health &amp; Aging</text>
<text x="265" y="192" text-anchor="middle" class="ph-zh" fill="#185FA5">健康與高齡</text>

<text x="265" y="214" text-anchor="middle" class="tp-en">Frailty in older adults</text>
<text x="265" y="228" text-anchor="middle" class="tp-zh">高齡衰弱</text>
<text x="265" y="246" text-anchor="middle" class="tp-en">COVID-19 &amp; aging</text>
<text x="265" y="260" text-anchor="middle" class="tp-zh">疫情與高齡化</text>
<text x="265" y="278" text-anchor="middle" class="tp-en">Community care</text>
<text x="265" y="292" text-anchor="middle" class="tp-zh">社區照護</text>

<text x="265" y="320" text-anchor="middle" class="geo">Taiwan · Thailand</text>
<text x="265" y="333" text-anchor="middle" class="geo">台灣 · 泰國</text>

<!-- ═══════════ Phase 3: Cross-National Systems ═══════════ -->
<circle cx="470" cy="130" r="28" fill="#eff8f4" stroke="#1C5A4A" stroke-width="2"/>
<text x="470" y="135" text-anchor="middle" font-size="15" fill="#1C5A4A" font-weight="700" font-family="Georgia, serif">III</text>

<text x="470" y="82" text-anchor="middle" class="yr" fill="#1C5A4A">2024–2025</text>
<text x="470" y="175" text-anchor="middle" class="ph-en" fill="#1C5A4A">Cross-National Systems</text>
<text x="470" y="192" text-anchor="middle" class="ph-zh" fill="#1C5A4A">跨國比較體系</text>

<text x="470" y="214" text-anchor="middle" class="tp-en">Digital inclusion</text>
<text x="470" y="228" text-anchor="middle" class="tp-zh">數位包容</text>
<text x="470" y="246" text-anchor="middle" class="tp-en">Disaster resilience</text>
<text x="470" y="260" text-anchor="middle" class="tp-zh">災害韌性</text>
<text x="470" y="278" text-anchor="middle" class="tp-en">Integrated care</text>
<text x="470" y="292" text-anchor="middle" class="tp-zh">整合照護</text>
<text x="470" y="310" text-anchor="middle" class="tp-en">Faith-based networks</text>
<text x="470" y="324" text-anchor="middle" class="tp-zh">宗教慈善網絡</text>

<text x="470" y="352" text-anchor="middle" class="geo">DE · JP · TW · TH · UK</text>
<text x="470" y="365" text-anchor="middle" class="geo">德 · 日 · 台 · 泰 · 英</text>

<!-- ═══════════ Phase 4: Climate-Care Nexus (current, highlighted) ═══════════ -->
<circle cx="670" cy="130" r="32" fill="#fff8e6" stroke="#C7922F" stroke-width="2.8" filter="url(#glow)"/>
<text x="670" y="124" text-anchor="middle" font-size="12.5" fill="#C7922F" font-weight="700" font-family="Georgia, serif">Climate</text>
<text x="670" y="140" text-anchor="middle" font-size="12.5" fill="#C7922F" font-weight="700" font-family="Georgia, serif">Care</text>

<text x="670" y="82" text-anchor="middle" class="yr" fill="#C7922F">2025 →</text>
<text x="670" y="182" text-anchor="middle" class="ph-en" fill="#C7922F">Climate-Care Nexus</text>
<text x="670" y="199" text-anchor="middle" class="ph-zh" fill="#C7922F">氣候—照護交會</text>

<text x="670" y="221" text-anchor="middle" class="tp-en" fill="#8a6a20">CVCVI instrument</text>
<text x="670" y="235" text-anchor="middle" class="tp-zh" fill="#b89848">氣候照護脆弱度指標</text>
<text x="670" y="253" text-anchor="middle" class="tp-en" fill="#8a6a20">ICE climate-emotion scales</text>
<text x="670" y="267" text-anchor="middle" class="tp-zh" fill="#b89848">氣候情緒量表</text>
<text x="670" y="285" text-anchor="middle" class="tp-en" fill="#8a6a20">NHIRD &amp; HART evidence</text>
<text x="670" y="299" text-anchor="middle" class="tp-zh" fill="#b89848">健保資料庫與 HART 追蹤</text>
<text x="670" y="317" text-anchor="middle" class="tp-en" fill="#8a6a20">Policy translation</text>
<text x="670" y="331" text-anchor="middle" class="tp-zh" fill="#b89848">政策轉譯</text>
<text x="670" y="349" text-anchor="middle" class="tp-en" fill="#8a6a20">Governance frameworks</text>
<text x="670" y="363" text-anchor="middle" class="tp-zh" fill="#b89848">治理架構</text>

<text x="670" y="391" text-anchor="middle" class="geo">Asia → Europe</text>
<text x="670" y="404" text-anchor="middle" class="geo">亞洲 → 歐洲</text>

<!-- Bottom subtitle -->
<text x="380" y="448" text-anchor="middle" font-size="11" fill="#bbb" font-style="italic" font-family="Georgia, serif">Research Trajectory · 研究軌跡</text>
</svg>
