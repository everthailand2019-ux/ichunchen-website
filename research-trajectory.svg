<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
<style>
  text { font-family: Georgia, 'Times New Roman', serif; }
  .yr { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .ph { font-size: 13px; font-weight: 600; }
  .tp { font-size: 10.5px; fill: #666; }
  .arrow { font-size: 10px; fill: #999; }
</style>
<defs>
  <linearGradient id="gFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b0b0b0"/>
    <stop offset="30%" stop-color="#185FA5"/>
    <stop offset="65%" stop-color="#1C5A4A"/>
    <stop offset="100%" stop-color="#C7922F"/>
  </linearGradient>
  <linearGradient id="gWide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.08"/>
    <stop offset="30%" stop-color="#185FA5" stop-opacity="0.08"/>
    <stop offset="65%" stop-color="#1C5A4A" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#C7922F" stop-opacity="0.15"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Wide flowing river (gets wider from left to right) -->
<path d="M90 125 Q180 118, 270 125 Q360 132, 450 125 Q540 118, 630 125" stroke="none" fill="none"/>
<path d="M90 110 Q180 100, 270 108 Q360 118, 450 110 Q540 100, 630 106
         L630 144 Q540 150, 450 140 Q360 132, 270 142 Q180 150, 90 140 Z"
      fill="url(#gWide)"/>

<!-- Main flow line -->
<path d="M90 125 Q180 118, 270 125 Q360 132, 450 125 Q540 118, 630 125"
      stroke="url(#gFlow)" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- Connecting arrows between phases -->
<path d="M114 125 L236 125" stroke="#ccc" stroke-width="1" stroke-dasharray="3,4" fill="none"/>
<path d="M296 125 L416 125" stroke="#aab" stroke-width="1" stroke-dasharray="3,4" fill="none"/>
<path d="M478 125 L596 125" stroke="#998" stroke-width="1" stroke-dasharray="3,4" fill="none"/>

<!-- Phase 1: Foundations -->
<circle cx="90" cy="125" r="22" fill="#f8f8f8" stroke="#b0b0b0" stroke-width="2"/>
<text x="90" y="130" text-anchor="middle" font-size="14" fill="#999" font-weight="700" font-family="Georgia, serif">I</text>
<text x="90" y="78" text-anchor="middle" class="yr" fill="#999">2015–2019</text>
<text x="90" y="170" text-anchor="middle" class="ph" fill="#888">Foundations</text>
<text x="90" y="192" text-anchor="middle" class="tp">Tourism &amp; hospitality</text>
<text x="90" y="208" text-anchor="middle" class="tp">Sports management</text>
<text x="90" y="224" text-anchor="middle" class="tp">Cross-cultural studies</text>

<!-- Phase 2: Health & Aging -->
<circle cx="270" cy="125" r="24" fill="#f0f5ff" stroke="#185FA5" stroke-width="2"/>
<text x="270" y="130" text-anchor="middle" font-size="14" fill="#185FA5" font-weight="700" font-family="Georgia, serif">II</text>
<text x="270" y="78" text-anchor="middle" class="yr" fill="#185FA5">2020–2023</text>
<text x="270" y="170" text-anchor="middle" class="ph" fill="#185FA5">Health &amp; Aging</text>
<text x="270" y="192" text-anchor="middle" class="tp">Frailty in older adults</text>
<text x="270" y="208" text-anchor="middle" class="tp">COVID-19 &amp; aging</text>
<text x="270" y="224" text-anchor="middle" class="tp">Community care</text>

<!-- Phase 3: Comparative Systems -->
<circle cx="450" cy="125" r="26" fill="#edf7f3" stroke="#1C5A4A" stroke-width="2"/>
<text x="450" y="130" text-anchor="middle" font-size="14" fill="#1C5A4A" font-weight="700" font-family="Georgia, serif">III</text>
<text x="450" y="78" text-anchor="middle" class="yr" fill="#1C5A4A">2024–2025</text>
<text x="450" y="170" text-anchor="middle" class="ph" fill="#1C5A4A">Cross-National</text>
<text x="450" y="186" text-anchor="middle" class="ph" fill="#1C5A4A">Systems</text>
<text x="450" y="208" text-anchor="middle" class="tp">Digital inclusion</text>
<text x="450" y="224" text-anchor="middle" class="tp">Disaster resilience</text>
<text x="450" y="240" text-anchor="middle" class="tp">Integrated care</text>
<text x="450" y="256" text-anchor="middle" class="tp">Faith-based networks</text>

<!-- Phase 4: Climate-Care Nexus (highlighted) -->
<circle cx="630" cy="125" r="30" fill="#fff8e8" stroke="#C7922F" stroke-width="3" filter="url(#glow)"/>
<text x="630" y="121" text-anchor="middle" font-size="13" fill="#C7922F" font-weight="700" font-family="Georgia, serif">Climate</text>
<text x="630" y="135" text-anchor="middle" font-size="13" fill="#C7922F" font-weight="700" font-family="Georgia, serif">Care</text>
<text x="630" y="78" text-anchor="middle" class="yr" fill="#C7922F">2025 →</text>
<text x="630" y="178" text-anchor="middle" class="ph" fill="#C7922F">Climate-Care</text>
<text x="630" y="194" text-anchor="middle" class="ph" fill="#C7922F">Nexus</text>
<text x="630" y="218" text-anchor="middle" class="tp" fill="#8a6a20">CVCVI instrument</text>
<text x="630" y="234" text-anchor="middle" class="tp" fill="#8a6a20">ICE climate-emotion scales</text>
<text x="630" y="250" text-anchor="middle" class="tp" fill="#8a6a20">NHIRD &amp; HART evidence</text>
<text x="630" y="266" text-anchor="middle" class="tp" fill="#8a6a20">Policy translation</text>
<text x="630" y="282" text-anchor="middle" class="tp" fill="#8a6a20">Governance frameworks</text>

<!-- Convergence arrows (subtle curved lines showing how streams merge) -->
<path d="M112 135 Q160 180, 248 135" stroke="#b0b0b0" stroke-width="0.8" fill="none" opacity="0.4" stroke-dasharray="2,3"/>
<path d="M294 135 Q370 175, 424 135" stroke="#4a7cbf" stroke-width="0.8" fill="none" opacity="0.4" stroke-dasharray="2,3"/>
<path d="M476 135 Q550 170, 600 135" stroke="#1C5A4A" stroke-width="0.8" fill="none" opacity="0.4" stroke-dasharray="2,3"/>

<!-- Bottom label -->
<text x="360" y="340" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic" font-family="Georgia, serif">Research Trajectory</text>

<!-- Subtle country markers along the bottom -->
<text x="90" y="365" text-anchor="middle" font-size="9" fill="#ccc" font-family="Georgia, serif">Taiwan</text>
<text x="270" y="365" text-anchor="middle" font-size="9" fill="#ccc" font-family="Georgia, serif">Taiwan · Thailand</text>
<text x="450" y="365" text-anchor="middle" font-size="9" fill="#ccc" font-family="Georgia, serif">DE · JP · TW · TH · UK</text>
<text x="630" y="365" text-anchor="middle" font-size="9" fill="#ccc" font-family="Georgia, serif">Asia → Europe</text>
</svg>
